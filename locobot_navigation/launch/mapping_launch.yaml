launch:

- node:
    pkg:  slam_toolbox
    exec: sync_slam_toolbox_node
    name: 'slam_toolbox'
    #launch-prefix: 'xterm -e gdb -ex=r --args'
    param:
    - from: '$(find-pkg-share locobot_navigation)/config/slam_toolbox_config.yaml'

- node:
    pkg:  nav2_map_server
    exec: map_saver_server
    name: 'map_server'
    param:
    - from: '$(find-pkg-share locobot_navigation)/config/nav2_params.yaml'
