launch:

- include:
    # With composition.
    file: '$(find-pkg-share locobot_navigation)/launch/nav2_composed_launch.py'
    arg:
    - {'name': 'use_composition', 'value': 'True'}
    - {'name': 'params_file', 'value': '$(find-pkg-share locobot_navigation)/config/nav2_params.yaml'}

- node:
    pkg:  locobot_navigation
    exec: py_egocircle
    name: 'ego_circle'

